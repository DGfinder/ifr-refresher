name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Content check
        run: npm run content:check

      - name: Production build
        run: npm run build

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Browser smoke and a11y
        run: npm run playwright
        env:
          PLAYWRIGHT_CHROME_CHANNEL: chrome

      - name: PWA offline smoke
        run: npm run playwright:pwa
        env:
          PLAYWRIGHT_CHROME_CHANNEL: chrome

      - name: Lighthouse budgets
        run: |
          timeout 180s npm run lighthouse || {
            echo "::warning::Lighthouse was not stable in GitHub Actions; keeping the runner guard blocking and requiring local npm run lighthouse in PR evidence."
            npm run test -- lighthouseGate
          }
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Pillars lint (advisory during adoption)
        run: npm run pillars:lint:advisory

      - name: Frontend lint (advisory during adoption)
        run: npm run frontend:lint:advisory

      - name: Runtime dependency audit
        run: npm audit --omit=dev
